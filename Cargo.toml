[package]
name = "nagi-escrow"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/nagi"
homepage = "https://github.com/savageAZfck/nagi"
license = "MIT"
description = "Dead-man memory escrow: Shamir-split secrets across owned custodians with signed shards, quorum or timed recovery, and recovery certificates — named for the Lakota nagi, the spirit that survives the body"
keywords = ["escrow", "shamir", "secret-sharing", "dead-man-switch", "recovery"]
categories = ["cryptography"]
readme = "README.md"

[lib]
# The crates.io package is `nagi-escrow` (the bare `nagi` name is taken by
# an abandoned crate); the library keeps the short name so `use nagi::…`
# stays stable.
name = "nagi"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"

[features]
default = []
